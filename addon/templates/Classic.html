<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color: #222; margin: 36px; }
    table { width: 100%; border-collapse: collapse; }
    .muted { color: #666; }
    .title { font-size: 26pt; font-weight: bold; letter-spacing: 1px; text-align: right; }
    .meta td { padding: 2px 0; }
    .items { margin-top: 28px; }
    .items th { text-align: left; border-bottom: 2px solid #222; padding: 8px 4px; font-size: 10pt; text-transform: uppercase; }
    .items td { border-bottom: 1px solid #ddd; padding: 8px 4px; vertical-align: top; }
    .amount, .items th.amount { text-align: right; white-space: nowrap; }
    .sub td { border-bottom: none; padding: 4px; color: #444; }
    .total td { border-bottom: none; font-size: 13pt; font-weight: bold; padding-top: 14px; }
    .section-label { font-size: 9pt; text-transform: uppercase; color: #666; margin-bottom: 4px; }
    .footer { margin-top: 48px; font-size: 8pt; color: #999; text-align: center; }
  </style>
</head>
<body>
  <table>
    <tr>
      <td style="vertical-align: top;">
        <? if (logo) { ?><img src="<?!= logo ?>" style="max-height: 70px; max-width: 200px; margin-bottom: 8px;"><br><? } ?>
        <strong><?= profile.businessName ?></strong><br>
        <span class="muted"><?!= nl2br_(profile.address) ?></span>
        <? if (profile.businessEmail) { ?><br><span class="muted"><?= profile.businessEmail ?></span><? } ?>
        <? if (profile.taxId) { ?><br><span class="muted">Tax ID: <?= profile.taxId ?></span><? } ?>
      </td>
      <td style="vertical-align: top; text-align: right;">
        <div class="title">INVOICE</div>
        <table class="meta" style="width: auto; margin-left: auto; margin-top: 8px;">
          <tr><td class="muted" style="padding-right: 12px;">Invoice #</td><td class="amount"><?= invoice.number ?></td></tr>
          <tr><td class="muted" style="padding-right: 12px;">Date</td><td class="amount"><?= invoice.issueDate ?></td></tr>
          <? if (invoice.dueDate) { ?>
          <tr><td class="muted" style="padding-right: 12px;">Due</td><td class="amount"><?= invoice.dueDate ?></td></tr>
          <? } ?>
        </table>
      </td>
    </tr>
  </table>

  <div style="margin-top: 28px;">
    <div class="section-label">Bill to</div>
    <strong><?= invoice.clientName ?></strong>
    <? if (invoice.clientAddress) { ?><br><?!= nl2br_(invoice.clientAddress) ?><? } ?>
    <? if (invoice.clientEmail) { ?><br><?= invoice.clientEmail ?><? } ?>
  </div>

  <table class="items">
    <tr><th>Description</th><th class="amount">Amount</th></tr>
    <? for (var i = 0; i < invoice.items.length; i++) { ?>
    <tr>
      <td><?!= nl2br_(invoice.items[i].description) ?></td>
      <td class="amount"><?= invoice.items[i].amountText ?></td>
    </tr>
    <? } ?>
    <? if (invoice.showSubtotal) { ?>
    <tr class="sub"><td class="amount">Subtotal</td><td class="amount"><?= invoice.subtotalText ?></td></tr>
    <? if (invoice.discountText) { ?><tr class="sub"><td class="amount">Discount</td><td class="amount"><?= invoice.discountText ?></td></tr><? } ?>
    <? if (invoice.taxText) { ?><tr class="sub"><td class="amount"><?= invoice.taxLabel ?></td><td class="amount"><?= invoice.taxText ?></td></tr><? } ?>
    <? } ?>
    <tr class="total"><td class="amount">Total due</td><td class="amount"><?= invoice.totalText ?></td></tr>
  </table>

  <? if (invoice.notes) { ?>
  <div style="margin-top: 28px;">
    <div class="section-label">Notes</div>
    <?!= nl2br_(invoice.notes) ?>
  </div>
  <? } ?>

  <? if (profile.paymentInstructions) { ?>
  <div style="margin-top: 36px;">
    <div class="section-label">Payment instructions</div>
    <?!= nl2br_(profile.paymentInstructions) ?>
  </div>
  <? } ?>

  <? if (showFooter) { ?><div class="footer">Made with Rowvoice</div><? } ?>
</body>
</html>
